# 发布：推 v* tag（或手动触发）→ 构建 + Developer ID 签名 + 公证 + 上传 GitHub Release。
# 所需 Secrets（Settings → Secrets and variables → Actions）：
#   CSC_LINK            Developer ID Application 证书 .p12 的 base64
#   CSC_KEY_PASSWORD    .p12 导出密码
#   APPLE_API_KEY_P8    App Store Connect API key（.p8 文件内容）
#   APPLE_API_KEY_ID    Key ID
#   APPLE_API_ISSUER    Issuer ID
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # publish-release.mjs 用 gh 创建 release / 上传产物

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME ≠ package.json v$v"; exit 1; }

      - run: npm ci

      - name: 写入 App Store Connect API key
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: 构建、签名、公证并发布
        run: npm run release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
