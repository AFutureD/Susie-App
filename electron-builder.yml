appId: me.afuture.susie
productName: Susie
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - '!dist/**/*.map'
  # codex 二进制（~300MB/平台）不随包分发，改为运行时按需下载（CodexInstaller）；
  # 只保留 @openai/codex 的 package.json 元数据用于确定下载版本
  - '!**/node_modules/@openai/codex-darwin-arm64/**'
  - '!**/node_modules/@openai/codex-darwin-x64/**'
  - '!**/node_modules/@openai/codex-linux-arm64/**'
  - '!**/node_modules/@openai/codex-linux-x64/**'
  - '!**/node_modules/@openai/codex-win32-arm64/**'
  - '!**/node_modules/@openai/codex-win32-x64/**'
# 应用不做多语言：Electron 框架 220 个 Chromium 语言包（~47MB）只留中文
electronLanguages:
  - zh_CN
asar: true
npmRebuild: false
# 自动更新 feed：GitHub Releases（公开仓库可匿名下载）。
# `electron-builder --publish` 会生成并上传 latest-mac.yml；打包时把 feed 信息写进 app-update.yml 供 electron-updater 读取
publish:
  - provider: github
    owner: AFutureD
    repo: Susie-App
mac:
  category: public.app-category.productivity
  darkModeSupport: true
  icon: build/icon.icns
  # 有 Developer ID 证书时自动签名+公证：
  # 环境变量 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID（notarytool）
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  sign: false
