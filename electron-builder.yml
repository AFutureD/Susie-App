appId: me.afuture.susie
productName: Susie
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - '!dist/**/*.map'
  # codex 二进制（~300MB/平台）不随包分发，改为运行时按需下载（CodexInstaller）；
  # 只保留 @openai/codex 的 package.json 元数据用于确定下载版本
  - '!**/node_modules/@openai/codex-darwin-arm64/**'
  - '!**/node_modules/@openai/codex-darwin-x64/**'
  - '!**/node_modules/@openai/codex-linux-arm64/**'
  - '!**/node_modules/@openai/codex-linux-x64/**'
  - '!**/node_modules/@openai/codex-win32-arm64/**'
  - '!**/node_modules/@openai/codex-win32-x64/**'
# 应用不做多语言：Electron 框架 220 个 Chromium 语言包（~47MB）只留中文
electronLanguages:
  - zh_CN
asar: true
npmRebuild: false
# 自动更新 feed：GitHub Releases（公开仓库可匿名下载）。
# 打包时据此生成 app-update.yml（供 electron-updater 读取）与本地 latest-mac.yml。
# 上传不走 electron-builder（大文件静默失败 + draft 坑），由 scripts/publish-release.mjs 用 gh 完成。
publish:
  - provider: github
    owner: AFutureD
    repo: Susie-App
mac:
  category: public.app-category.productivity
  darkModeSupport: true
  icon: build/icon.icns
  # 自动发现 Developer ID 证书签名；公证走 App Store Connect API Key：
  # 环境变量 APPLE_API_KEY（.p8 路径）/ APPLE_API_KEY_ID / APPLE_API_ISSUER（见 docs/developer/release.md）
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  sign: false
